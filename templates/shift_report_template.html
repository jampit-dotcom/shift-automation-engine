
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOC Shift Handoff Report</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-blue: #38bdf8;
            --badge-open-bg: #991b1b;
            --badge-open-text: #fca5a5;
            --border-color: #334155;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 30px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        .header {
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
            color: var(--accent-blue);
            letter-spacing: -0.5px;
        }

        .meta-info {
            font-size: 14px;
            color: var(--text-secondary);
            text-align: right;
        }

        .metrics-banner {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            display: flex;
            gap: 40px;
        }

        .metric {
            display: flex;
            flex-direction: column;
        }

        .metric-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .metric-value {
            font-size: 20px;
            font-weight: bold;
            color: var(--accent-blue);
        }

        .ticket-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .ticket-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .ticket-id {
            font-family: monospace;
            background: var(--border-color);
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            color: var(--accent-blue);
        }

        .ticket-title {
            font-size: 18px;
            font-weight: 600;
            flex-grow: 1;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-open {
            background-color: var(--badge-open-bg);
            color: var(--badge-open-text);
        }

        .summary-section {
            background-color: #0f172a;
            border-left: 4px solid var(--accent-blue);
            padding: 12px 16px;
            border-radius: 0 6px 6px 0;
            margin-bottom: 15px;
        }

        .summary-section p {
            margin: 5px 0 0 0;
            color: var(--text-primary);
            line-height: 1.5;
        }

        .raw-details {
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .raw-details summary {
            outline: none;
            user-select: none;
        }

        .raw-details p {
            margin-top: 10px;
            padding: 10px;
            background: #0f172a;
            border-radius: 4px;
            font-family: monospace;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>SOC Shift Handoff Report</h1>
                <span style="color: var(--text-secondary); font-size: 14px;">Automated Cyber Incident Operations Summary</span>
            </div>
            <div class="meta-info">
                <div><strong>Generated:</strong> {now}</div>
                <div><strong>Classification:</strong> CTI Operational Internal</div>
            </div>
        </div>

        <div class="metrics-banner">
            <div class="metric">
                <span class="metric-label">Active Handoff Tickets</span>
                <span class="metric-value">{total_tickets}</span>
            </div>
            <div class="metric">
                <span class="metric-label">AI Processing Status</span>
                <span class="metric-value" style="color: #4ade80;">100% Complete</span>
            </div>
        </div>

        <div class="tickets-container">
            {ticket_cards_html}
        </div>
    </div>
</body>
</html>
